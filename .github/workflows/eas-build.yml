name: EAS Build (Android)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: false
        default: "production"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install --no-bin-links

      - name: Run tests
        run: npm test

      - name: Build Android
        run: |
          mkdir -p dist
          eas build -p android -e "${{ inputs.profile || 'production' }}" --non-interactive --wait --json > eas-build-output.json
          cat eas-build-output.json
          BUILD_URL=$(node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("eas-build-output.json", "utf8"));
            const item = Array.isArray(data) ? data[0] : data;
            console.log(item?.artifacts?.buildUrl || "");
          ')
          if [ -n "$BUILD_URL" ]; then
            echo "Downloading build artifact from $BUILD_URL..."
            curl -fL "$BUILD_URL" -o dist/conduit-bend-calc-1.9.1-vc8.aab
          else
            echo "Warning: no buildUrl found in eas-build-output.json"
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-aab
          path: dist/*.aab
          if-no-files-found: warn
